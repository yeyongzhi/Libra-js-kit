<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>libra-js-kit测试用例代码</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      body {
        height: 100vh;
        overflow-x: hidden;
        overflow-y: auto;
        padding: 10px;
      }
      .page_container {
        width: 100%;
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        margin-bottom: 40px;
      }
      .box {
        border: 1px solid #dddddd;
        border-radius: 8px;
        padding: 10px;
        color: #000000;
        box-sizing: border-box;
        width: calc(25% - 15px);
      }
      .page_title {
        font-size: 20px;
        font-weight: bolder;
        margin-bottom: 20px;
      }
      .title {
        font-size: 18px;
      }
      .content {
        background-color: #f5f5f5;
        display: flex;
        justify-content: flex-start;
        align-items: center;
        padding: 10px;
        border-radius: 8px;
      }
      .value {
        font-size: 16px;
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <script type="module" src="./index.js"></script>
  </body>
</html>
